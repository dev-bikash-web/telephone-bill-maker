[PrintCredentials]
url = https://printserv.cdot.in/
username = YOUR_PRINT_USERNAME
password = YOUR_PRINT_PASSWORD

[PrintSettings]
# Page number to extract and print from each bill PDF (1-indexed, default is 3)
page_number = 3
# Printer name (default is 7tf)
printer = 7tf

# [Browser]
# Optional: Path to custom Firefox binary if not auto-detected
# firefox_binary = /snap/firefox/current/usr/lib/firefox/firefox
